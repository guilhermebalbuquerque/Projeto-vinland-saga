<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/vinland_saga/icons/icon_viland_saga.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinland Saga | Painel</title>
    <script src="../js/sessao.js"></script>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #111111;
            font-family: 'Segoe UI', sans-serif;
            color: #e8d8c0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 80px;
            background-color: rgba(10, 5, 5, 0.95);
            border-bottom: 1px solid rgba(170, 0, 0, 0.4);
        }

        .header h1 {
            margin: 0;
            color: #aa0000;
        }

        .header span {
            cursor: pointer;
            color: #cccccc;
        }

        .conteudo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            gap: 25px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-vermelho {
            background-color: #aa0000;
            border: none;
            color: white;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #aa0000;
            color: #aa0000;
        }
    </style>
</head>

<body onload="validarSessao()">

    <div class="header">
        <h1>Vinland Saga</h1>
        <span onclick="limparSessao()">Sair</span>
    </div>

    <div class="conteudo">
        <h2>Olá, <span id="b_usuario" style="color: #aa0000;"></span>!</h2>

        <a href="../quiz/quiz.html">
            <button class="btn btn-vermelho">Fazer o Quiz</button>
        </a>

        <a href="../dashboard.html">
            <button class="btn btn-outline">Ver Dashboard</button>
        </a>
    </div>

</body>

<script>
    document.getElementById("b_usuario").innerHTML = sessionStorage.NOME_USUARIO;
</script>

</html>
